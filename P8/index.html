
<!DOCTYPE html>
<html >
<head>
    <title>Sticky Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>MyPortfolio</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
        </div>
    </nav>

    <section id="home" class="hero">
        <h1>Welcome to My Portfolio</h1>
        <p>Creative Developer | Student</p>
    </section>

    <section id="about" class="content">
        <h2>About Me</h2>
        <p>I love learning technology and building projects.</p>
    </section>

    <section id="projects" class="content">
        <h2>My Projects</h2>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800"
                 alt="Laptop showing code">
            <div class="overlay">
                <h3>Web Development</h3>
                <p>My HTML and CSS project.</p>
            </div>
        </div>
    </section>

</body>
</html>
